name: CI

on:
    push:
        branches: [v2.x]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    # Authenticated downloads from GitHub have a higher rate limit
    COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'

jobs:
    lint:
        name: Pint and Larastan
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: imagick
                  coverage: none

            - name: Validate composer.json
              run: composer validate --strict

            - name: Cache Composer downloads
              uses: actions/cache@v4
              with:
                  path: ~/.cache/composer/files
                  key: composer-${{ runner.os }}-lint-${{ hashFiles('composer.json') }}
                  restore-keys: composer-${{ runner.os }}-lint-

            - name: Install dependencies
              run: composer update --prefer-dist --no-interaction --no-progress

            - name: Check code style
              run: composer lint

            - name: Run static analysis
              run: composer analyse -- --no-progress

    tests:
        name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4', '8.5']
                laravel: ['12.*', '13.*']
        env:
            FFMPEG_BIN: /usr/bin/ffmpeg
            FFPROBE_BIN: /usr/bin/ffprobe
            AUDIOWAVEFORM_BIN: /usr/bin/audiowaveform
            IMAGICK_CONVERT_BIN: /usr/bin/convert
            OTFINFO_BIN: /usr/bin/otfinfo
        steps:
            - uses: actions/checkout@v5

            # Needed by the 1.x test suite until it is removed from v2.x (#29)
            - name: Install media tools
              run: |
                  sudo add-apt-repository --yes ppa:chris-needham/ppa
                  sudo apt-get update
                  sudo apt-get install --yes --no-install-recommends ffmpeg audiowaveform imagemagick lcdf-typetools

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: imagick
                  coverage: none

            - name: Cache Composer downloads
              uses: actions/cache@v4
              with:
                  path: ~/.cache/composer/files
                  key: composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
                  restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.laravel }}-

            - name: Install dependencies
              run: |
                  composer require "illuminate/support:${{ matrix.laravel }}" --no-update --no-interaction
                  composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

            - name: Show installed versions
              run: |
                  for package in laravel/framework orchestra/testbench phpunit/phpunit; do
                      composer show "$package" | grep -E '^(name|versions)'
                  done

            - name: Run tests
              run: composer test
