name: CI

on:
    push:
        branches: [v2.x]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    # Authenticated downloads from GitHub have a higher rate limit
    COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'

jobs:
    lint:
        name: Pint and Larastan
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v5

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none

            - name: Validate composer.json
              run: composer validate --strict

            - name: Cache Composer downloads
              uses: actions/cache@v4
              with:
                  path: ~/.cache/composer/files
                  key: composer-${{ runner.os }}-lint-${{ hashFiles('composer.json') }}
                  restore-keys: composer-${{ runner.os }}-lint-

            - name: Install dependencies
              run: composer update --prefer-dist --no-interaction --no-progress

            - name: Check code style
              run: composer lint

            - name: Run static analysis
              run: composer analyse -- --no-progress

    dashboard:
        name: Dashboard
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        defaults:
            run:
                working-directory: dashboard
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: dashboard/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Type check and test
              run: |
                  npm run typecheck
                  npm test

            # dist/ is committed and served by the package: it must be the
            # build of the sources it ships with
            - name: Check that dist/ is up to date
              run: |
                  npm run build
                  git status --porcelain -- ../dist
                  test -z "$(git status --porcelain -- ../dist)" || { echo "dist/ doesn't match the sources: run npm run build in dashboard/ and commit it."; exit 1; }

    tests:
        name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4', '8.5']
                laravel: ['12.*', '13.*']
        steps:
            - uses: actions/checkout@v5

            # The Azure Ubuntu mirror sometimes throttles a runner to a few
            # dozen kB/s for the whole job, which apt's own timeouts don't catch
            # (#96). The packages are cached between runs, keyed on the runner
            # image so they follow its updates.
            - name: Find the runner image
              id: image
              run: echo "version=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

            - name: Restore media tools packages
              id: apt-cache
              uses: actions/cache/restore@v4
              env:
                  # A slow restore counts as a miss instead of holding the job
                  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
              with:
                  path: ~/apt-archives
                  key: apt-media-tools-${{ steps.image.outputs.version }}
                  restore-keys: apt-media-tools-

            # Each apt-get call that downloads is capped and retried. After a
            # failed attempt, the next one skips the Azure mirror for the next
            # mirror of the runner's list, and keeps the packages already
            # downloaded. The install then only reads the local cache.
            - name: Install media tools
              timeout-minutes: 12
              run: |
                  packages=(ffmpeg imagemagick)
                  mirrors=/etc/apt/apt-mirrors.txt
                  apt_get_with_retries() {
                      local limit=$1
                      shift
                      for attempt in 1 2 3; do
                          sudo timeout --kill-after=10 "$limit" apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 "$@" && return 0
                          echo "::warning::apt-get $1 failed or took more than ${limit}s (attempt ${attempt} of 3)"
                          if [ -f "$mirrors" ]; then
                              sudo sed -i '/azure\.archive\.ubuntu\.com/d' "$mirrors"
                          fi
                      done
                      return 1
                  }
                  mkdir -p ~/apt-archives
                  sudo find ~/apt-archives -name '*.deb' -exec cp -t /var/cache/apt/archives/ {} +
                  apt_get_with_retries 60 update
                  apt_get_with_retries 120 install -y --no-install-recommends --download-only "${packages[@]}"
                  # Keep the current packages for the cache, without the
                  # versions the mirror no longer has
                  sudo apt-get autoclean
                  rm -f ~/apt-archives/*.deb
                  cp /var/cache/apt/archives/*.deb ~/apt-archives/
                  sudo apt-get install -y --no-install-recommends "${packages[@]}"
                  ffprobe -version | head -n 1

            - name: Save media tools packages
              if: steps.apt-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v4
              with:
                  path: ~/apt-archives
                  key: ${{ steps.apt-cache.outputs.cache-primary-key }}

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: imagick
                  coverage: none

            - name: Cache Composer downloads
              uses: actions/cache@v4
              with:
                  path: ~/.cache/composer/files
                  key: composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
                  restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.laravel }}-

            - name: Install dependencies
              run: |
                  composer require "illuminate/support:${{ matrix.laravel }}" --no-update --no-interaction
                  composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

            - name: Show installed versions
              run: |
                  for package in laravel/framework orchestra/testbench phpunit/phpunit; do
                      composer show "$package" | grep -E '^(name|versions)'
                  done

            - name: Run tests
              run: composer test

    # Tags a release when a push to v2.x passes CI and CHANGELOG.md has a dated
    # section whose version is not tagged yet: merging a release pull request
    # releases it. See "Releases" in AGENTS.md.
    release:
        name: Release
        needs: [lint, tests, dashboard]
        if: github.event_name == 'push' && github.ref == 'refs/heads/v2.x'
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@v5

            - name: Find the version to release
              id: version
              run: |
                  version=$(grep -m 1 -oE '^## \[[0-9][^]]*\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$' CHANGELOG.md \
                      | sed -E 's/^## \[([^]]+)\].*/\1/' || true)
                  if [ -z "$version" ]; then
                      echo "No released version in CHANGELOG.md yet."
                  elif git ls-remote --exit-code --tags origin "refs/tags/v${version}" > /dev/null; then
                      echo "v${version} is already tagged: nothing to release."
                  elif ! [[ "$version" =~ ^2\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
                      echo "'${version}' is not a 2.x version (2.0.0-alpha.1, 2.0.0-rc.1, 2.0.0, 2.1.0…)." >&2
                      exit 1
                  else
                      echo "Releasing v${version}."
                      echo "version=${version}" >> "$GITHUB_OUTPUT"
                  fi

            - name: Tag and publish the release
              if: steps.version.outputs.version != ''
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  .github/scripts/changelog-section.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
                  prerelease=()
                  if [[ "$VERSION" == *-* ]]; then
                      prerelease=(--prerelease --latest=false)
                  fi
                  gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                      --title "v${VERSION}" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
